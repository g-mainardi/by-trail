type: object
description: Represents a mountain shelter or bivouac.
properties:
  _id:
    type: string
    format: uuid
  name:
    type: string
    example: 'Bivacco Orobico'
  region:
    $ref: './Enums.yaml#/Region'
  mountainRange:
    type: string
    example: 'Alpi Orobie'
  comune:
    type: string
  coords:
    type: object
    properties:
      latitude:
        type: number
        format: double
      longitude:
        type: number
        format: double
  altitude:
    type: number
  capacity:
    type: number
    description: Number of people the bivouac can accommodate.
  note:
    type: string
    nullable: true
