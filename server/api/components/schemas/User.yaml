type: object
description: Represents a registered user in the system.
properties:
  _id:
    $ref: '../parameters.yaml#/userId'
  name:
    $ref: '../parameters.yaml#/name'
  email:
    $ref: '../parameters.yaml#/email'
  password:
    $ref: '../parameters.yaml#/password'
  type:
    $ref: './Enums.yaml#/UserRole'
  status:
    $ref: './Enums.yaml#/UserStatus'
  creationDate:
    $ref: '../parameters.yaml#/date'
  favRegions:
    type: array
    description: List of favorite regions
    items:
      $ref: './Enums.yaml#/Region'
  favoritesBivouacs:
    type: array
    description: List of favorite bivouac IDs
    items:
      $ref: '../parameters.yaml#/bivouacId'
  favoritesRoutes:
    type: array
    description: List of favorite route IDs
    items:
      $ref: '../parameters.yaml#/routeId'
