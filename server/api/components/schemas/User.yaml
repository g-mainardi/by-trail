type: object
description: Represents a registered user in the system.
properties:
  _id:
    type: string
    format: uuid
    description: The internal database ID (UUID)
  name:
    type: string
    example: 'Mario Rossi'
  email:
    type: string
    format: email
    example: 'mario.rossi@example.com'
  password:
    type: string
    format: password
    writeOnly: true
    description: Hashed password
  type:
    $ref: './Enums.yaml#/UserRole'
  status:
    $ref: './Enums.yaml#/UserStatus'
  creationDate:
    type: string
    format: date-time
  favRegions:
    type: array
    description: List of favorite regions
    items:
      $ref: './Enums.yaml#/Region'
  favoritesBivouacs:
    type: array
    description: List of favorite bivouac IDs
    items:
      type: string
      format: uuid
  favoritesRoutes:
    type: array
    description: List of favorite route IDs
    items:
      type: string
      format: uuid
