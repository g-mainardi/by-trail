type: object
description: Represents a hiking route or trail.
properties:
  _id:
    type: string
    format: uuid
  title:
    type: string
  region:
    type: array
    description: Regions crossed by the route
    items:
      $ref: './Enums.yaml#/Region'
  difficulty:
    $ref: './Enums.yaml#/Difficulty'
  distance:
    type: number
    description: Total distance in km
  ascent:
    type: number
  descent:
    type: number
  duration:
    type: number
    description: Estimated duration in minutes
  routeType:
    $ref: './Enums.yaml#/RouteType'
  note:
    type: string
  path:
    type: object
    properties:
      type:
        type: string
        enum: [LineString, MultiLineString]
      coordinates:
        type: array
        items:
          type: array
