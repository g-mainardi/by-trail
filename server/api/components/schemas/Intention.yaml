type: object
properties:
  _id:
    type: string
    format: uuid
    description: Unique identifier for the intention
  user:
    type: string
    format: uuid
    description: ID of the user who made the intention
  bivouac:
    type: string
    format: uuid
    description: ID of the reserved bivouac
  reservedPlaces:
    type: integer
    description: Number of places reserved
    example: 2
  intentionDate:
    type: string
    format: date
    description: Date of the intention
    example: 2024-07-15
