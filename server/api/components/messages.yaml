MissingFields:
  summary: Missing required fields
  value:
    message:: 'Please fill in all required fields'

InvalidIdFormat:
  summary: Invalid ID format
  value:
    message: 'Invalid ID format'

NoValidFields:
  summary: No valid fields for update
  value:
    message: 'No valid fields provided for update'

InvalidCredentials:
  summary: Invalid credentials
  value:
    message: 'Invalid credentials'

ContactSupport:
  summary: Account issue
  value:
    message: 'There was a problem with your account. Please contact support at support@example.com.'

UserNotFound:
  summary: User not found
  value:
    message: 'User not found'

BivouacNotFound:
  summary: Bivouac not found
  value:
    message: 'Bivouac not found'

RouteNotFound:
  summary: Route not found
  value:
    message: 'Route not found'

# Generic Success Message Schema
Success:
  type: object
  properties:
    message:
      type: string
  example:
    message: 'Operation completed successfully'

# Generic Error Message Schema
Error:
  type: object
  properties:
    message:
      type: string
  example:
    message: 'An unexpected error occurred'
