# 200 - OK
SuccessfulUpdate:
  description: Resource updated successfully.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Success'
      examples:
        UpdateSuccess:
          summary: Successful update
          value:
            message: 'Resource updated successfully'
        NoChange:
          summary: No changes made
          value:
            message: 'No changes were made to the resource'

BivouacIntention:
  description: Resource updated successfully.
  content:
    application/json:
      schema:
        type: object
        properties:
          date:
            $ref: './parameters.yaml#/date'
            description: Date of the intention
          people:
            type: integer
            description: Number of people for the intention
            example: 2

BivouacContent:
  application/json:
    schema:
      $ref: '../components/schemas/Bivouac.yaml'

RouteContent:
  application/json:
    schema:
      $ref: '../components/schemas/Route.yaml'

BivouacsListContent:
  application/json:
    schema:
      type: object
      properties:
        bivouacs:
          type: array
          items:
            $ref: '../components/schemas/Bivouac.yaml'

RoutesListContent:
  application/json:
    schema:
      type: object
      properties:
        bivouacs:
          type: array
          items:
            $ref: '../components/schemas/Route.yaml'

IntentionListContent:
  application/json:
    schema:
      type: object
      properties:
        intentions:
          type: array
          items:
            $ref: '../components/schemas/Intention.yaml'

NotificationListContent:
  application/json:
    schema:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '../components/schemas/Notification.yaml'

# 400 - Bad Request
BadUpdateRequest:
  description: Invalid update request format or validation error.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Error'
      examples:
        InvalidIdFormat:
          $ref: '../components/messages.yaml#/InvalidIdFormat'
        NoValidFields:
          $ref: '../components/messages.yaml#/NoValidFields'

InvalidIdFormat:
  description: The provided ID format is invalid.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Invalid ID format'

# 401 - Unauthorized
UnauthorizedError:
  description: Authentication failed. Token missing, invalid, or expired.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Error'
      examples:
        UserNotFound:
          summary: User not found
          value:
            message: 'User not found / Token invalid'
        MissingUserID:
          summary: User ID missing
          value:
            message: 'User ID missing / Token invalid'
        AuthMiddlewareErrors:
          summary: Auth Middleware Error
          value:
            message: 'Not authorized, token failed'

# 403 - Forbidden
ForbiddenError_onlyAdmin:
  description: Access denied. User lacks necessary permissions (Admin required).
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Admin access required'

ForbiddenError_bannedUser:
  description: Access denied. User is banned.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'User is banned'

ForbiddenError_admin:
  description: Access denied. Cannot perform this action on admin users.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Error'
      examples:
        CannotChangeAdminAction:
          summary: Cannot perform action on admin user
          value:
            message: 'Cannot perform delete an admin user'
        CannotChangeAdminStatus:
          summary: Cannot change status of admin user
          value:
            message: 'Cannot change status of an admin user'

# 404 - Not Found
UserNotFound:
  description: The requested user does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'User not found'
BivouacNotFound:
  description: The requested bivouac does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Bivouac not found'
RouteNotFound:
  description: The requested route does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Route not found'
ProposalNotFound:
  description: The requested proposal does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Proposal not found'
IntentionNotFound:
  description: The requested intention does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Intention not found'
NotificationNotFound:
  description: The requested notification does not exist.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Notification not found'

# 409 - Conflict
BivouacAlreadyFavorited:
  description: The bivouac is already in the user's favorites.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Error'
      example:
        message: 'Bivouac is already in favorites'
RouteAlreadyFavorited:
  description: The route is already in the user's favorites.
  content:
    application/json:
      schema:
        $ref: '../components/messages.yaml#/Error'
      example:
        message: 'Route is already in favorites'

# 429 - Too Many Requests
TooManyRequestsError:
  description: Rate limit exceeded.
  headers:
    Retry-After:
      description: The number of seconds to wait before retrying.
      schema:
        type: integer
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Too many requests, please try again later.'

# 500 - Internal Server Error
ServerError:
  description: Unexpected server error.
  content:
    application/json:
      schema:
        type: object
        properties:
          message:
            type: string
            example: 'Server Error'
