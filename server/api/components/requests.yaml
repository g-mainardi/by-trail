LoginRequest:
  type: object
  properties:
    email:
      $ref: './parameters.yaml#/email'
    password:
      $ref: './parameters.yaml#/password'
  required:
    - email
    - password

SignupRequest:
  type: object
  properties:
    name:
      $ref: './parameters.yaml#/name'
    email:
      $ref: './parameters.yaml#/email'
    password:
      $ref: './parameters.yaml#/password'
  required:
    - name
    - email
    - password

UserUpdateRequest:
  type: object
  properties:
    name:
      $ref: './parameters.yaml#/name'
    favRegions:
      $ref: './parameters.yaml#/favRegions'

RequestWithinBoundingBox:
  type: object
  properties:
    latNw:
      type: number
      format: float
      description: Latitude of the northwest corner of the bounding box
      example: 45.8321
    lonNw:
      type: number
      format: float
      description: Longitude of the northwest corner of the bounding box
      example: 9.1234
    latSe:
      type: number
      format: float
      description: Latitude of the southeast corner of the bounding box
      example: 45.1234
    lonSe:
      type: number
      format: float
      description: Longitude of the southeast corner of the bounding box
      example: 9.8321

CreateReservationRequest:
  type: object
  properties:
    bivouacId:
      $ref: './parameters.yaml#/bivouacId'
    date:
      $ref: './parameters.yaml#/date'
    people:
      type: integer
      description: Number of people for the reservation
      example: 3
  required:
    - bivouacId
    - userId
    - reservationDate
