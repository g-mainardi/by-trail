userId:
  name: id
  in: path
  format: uuid
  required: true
  description: User ID
  schema:
    type: string

bivouacId:
  name: id
  in: path
  format: uuid
  required: true
  description: Bivouac ID
  schema:
    type: string

routeId:
  name: id
  in: path
  format: uuid
  required: true
  description: Route ID
  schema:
    type: string

proposalId:
  name: id
  in: path
  format: uuid
  required: true
  description: Proposal ID
  schema:
    type: string

notificationId:
  name: id
  in: path
  format: uuid
  required: true
  description: Notification ID
  schema:
    type: string

password:
  name: password
  in: body
  required: true
  description: User password
  schema:
    type: string
    format: password
  example: Gino1234

email:
  name: email
  in: body
  required: true
  description: User email address
  schema:
    type: string
    format: email
  example: gino@gino.it

name:
  name: name
  in: body
  required: true
  description: User full name
  schema:
    type: string
  example: Paolo Cannone

favRegions:
  name: favRegions
  in: body
  required: false
  description: List of favorite regions
  schema:
    type: array
    items:
      $ref: './schemas/Enums.yaml#/Region'
  example: ['Marche', 'Emilia-Romagna']

favoritesBivouacs:
  name: favoritesBivouacs
  in: body
  required: false
  description: List of favorite bivouac IDs
  schema:
    type: array
    items:
      $ref: './parameters.yaml#/bivouacId'

favoritesRoutes:
  name: favoritesRoutes
  in: body
  required: false
  description: List of favorite route IDs
  schema:
    type: array
    items:
      $ref: './parameters.yaml#/routeId'

date:
  name: date
  in: body
  required: true
  description: Date in ISO 8601 format
  schema:
    type: string
    format: date-time
  example: '2023-10-05T14:48:00.000Z'

token:
  name: token
  in: body
  required: true
  description: Authentication token
  type: string
  example: '...long.jwt.token...'

userBasicInfo:
  name: user
  in: body
  required: true
  description: Basic information about the user
  type: object
  properties:
    _id:
      $ref: './parameters.yaml#/userId'
    name:
      $ref: './parameters.yaml#/name'
    email:
      $ref: './parameters.yaml#/email'
    type:
      $ref: './schemas/Enums.yaml#/UserRole'
