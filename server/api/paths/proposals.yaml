sendProposal:
  post:
    tags:
      - Proposals
    summary: Submit a new route or bivouac proposal
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Proposal.yaml'
    responses:
      '201':
        description: Proposal registered successfully!
        content:
          application/json:
            schema:
              $ref: '../components/responses.yaml#/SuccessMessage'
            example:
              message: 'Proposal registered successfully!'
      '400':
        description: Bad Request - Validation or Logic Error
        content:
          application/json:
            schema:
              $ref: '../components/responses.yaml#/ErrorMessage'
            examples:
              MissingFields:
                $ref: '../components/messages.yaml#/MissingFields'
              DuplicateEntry:
                summary: Proposal already exists
                value:
                  message: "You have already submitted a route proposal with subject 'Sentiero degli Dei' in 'Bologna'"
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
