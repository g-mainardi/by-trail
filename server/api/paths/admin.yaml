listUsers:
  get:
    tags:
      - Admin
    summary: List all users
    operationId: listAllUsers
    responses:
      '200':
        description: A list of users
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/User.yaml'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

deleteUserById:
  delete:
    tags:
      - Admin
    summary: Delete a user by ID
    operationId: deleteUserById
    parameters:
      - $ref: '../components/parameters.yaml#/userId'
    responses:
      '204':
        description: User deleted successfully
      '400':
        description: Bad Request. Cannot delete your own account.
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'Cannot delete your own account, use the /auth/delete endpoint'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_admin'
      '404':
        $ref: '../components/responses.yaml#/UserNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

updateUserStatus:
  patch:
    tags:
      - Admin
    summary: Update a user's status (active, banned)
    operationId: updateUserStatus
    parameters:
      - $ref: '../components/parameters.yaml#/userId'
    responses:
      '200':
        description: User status updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/responses.yaml#/SuccessMessage'
            example:
              message: 'User status updated successfully'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/responses.yaml#/ErrorMessage'
            examples:
              CannotChangeOwnStatus:
                summary: Cannot change own status
                value:
                  message: 'Cannot change status of your own account'
              InvalidStatusType:
                summary: Invalid status value
                value:
                  message: "Status must be one of 'active' or 'banned'"
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_admin'
      '404':
        $ref: '../components/responses.yaml#/UserNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

manageBivouacById:
  delete:
    tags:
      - Admin
    summary: Delete a bivouac by ID
    operationId: deleteBivouacById
    parameters:
      - $ref: '../components/parameters.yaml#/bivouacId'
    responses:
      '204':
        description: Bivouac deleted successfully
      '400':
        $ref: '../components/responses.yaml#/InvalidIdFormat'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '404':
        $ref: '../components/responses.yaml#/BivouacNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
  patch:
    tags:
      - Admin
    summary: Update a bivouac by ID
    operationId: updateBivouacById
    parameters:
      - $ref: '../components/parameters.yaml#/bivouacId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Bivouac.yaml'
    responses:
      '200':
        $ref: '../components/responses.yaml#/SuccessfulUpdate'
      '400':
        $ref: '../components/responses.yaml#/BadUpdateRequest'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '404':
        $ref: '../components/responses.yaml#/BivouacNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

manageRouteById:
  delete:
    tags:
      - Admin
    summary: Delete a route by ID
    operationId: deleteRouteById
    parameters:
      - $ref: '../components/parameters.yaml#/routeId'
    responses:
      '204':
        description: Route deleted successfully
      '400':
        $ref: '../components/responses.yaml#/InvalidIdFormat'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '404':
        $ref: '../components/responses.yaml#/RouteNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
  patch:
    tags:
      - Admin
    summary: Update a route by ID
    operationId: updateRouteById
    parameters:
      - $ref: '../components/parameters.yaml#/routeId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Route.yaml'
    responses:
      '200':
        $ref: '../components/responses.yaml#/SuccessfulUpdate'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              $ref: '../components/responses.yaml#/ErrorMessage'
            examples:
              InvalidIdFormat:
                $ref: '../components/messages.yaml#/InvalidIdFormat'
              RouteAtLeastOneRegion:
                summary: Route must have at least one region
                value:
                  message: 'A route must have at least one region'
              InvalidPathType:
                summary: Invalid path type
                value:
                  message: "Path type must be one of 'hiking', 'cycling', or 'mountain_biking'"
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_onlyAdmin'
      '404':
        $ref: '../components/responses.yaml#/RouteNotFound'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

