realtimeWeather:
  post:
    tags:
      - Test
    summary: Manual Test Trigger for Real-time Weather Update
    description: Simulates a real-time weather update event for testing purposes.
    responses:
      '200':
        description: Real-time weather update event simulated successfully.
        content:
          application/json:
            schema:
              $ref: '../components/messages.yaml#/Success'
            example:
              message: 'Real-time weather update event simulated successfully.'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

realtimeIntention:
  post:
    tags:
      - Test
    summary: Test Real-time Intention Notification
    description: Simulates a real-time intention notification event for testing purposes.
    responses:
      '200':
        description: Real-time intention notification event simulated successfully.
        content:
          application/json:
            schema:
              $ref: '../components/messages.yaml#/Success'
            example:
              message: 'Test notification sent successfully.'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
