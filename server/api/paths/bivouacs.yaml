list:
  post:
    tags:
      - Bivouacs
    summary: Retrieve a list of bivouacs, optionally including coordinates within a bounding box.
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/requests.yaml#/RequestWithinBoundingBox'
    responses:
      '200':
        description: Bivouacs list retrieved successfully
        content:
          $ref: '../components/responses.yaml#/BivouacsListContent'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

getById:
  get:
    tags:
      - Bivouacs
    summary: Get a specific bivouac by ID
    operationId: getBivouacById
    parameters:
      - $ref: '../components/parameters.yaml#/bivouacId'
    responses:
      '200':
        description: Bivouac retrieved successfully
        content:
          $ref: '../components/responses.yaml#/BivouacContent'
      '400':
        $ref: '../components/responses.yaml#/InvalidIdFormat'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '404':
        $ref: '../components/responses.yaml#/BivouacNotFound'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

getIntentions:
  get:
    tags:
      - Intentions
    summary: Get anonymous intentions for a specific bivouac
    operationId: getBivouacIntentions
    parameters:
      - $ref: '../components/parameters.yaml#/bivouacId'
    responses:
      '200':
        $ref: '../components/responses.yaml#/BivouacIntention'
      '400':
        $ref: '../components/responses.yaml#/InvalidIdFormat'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
