login:
  security: [] # Public endpoint, no authentication required
  post:
    tags:
      - Authentication
    summary: User login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                example: gino@gino.it
              password:
                type: string
                format: password
                example: Gino1234
            required:
              - email
              - password
    responses:
      '200':
        description: Successful login
        content:
          application/json:
            schema:
              type: object
              properties:
                token: string
                user:
                  id: string
                  name: string
                  email: string
                  favRegions: array<string>
                  type: string
              example:
                token: '...long.jwt.token...'
                user:
                  id: '695244f63542e2c7bb6df27c'
                  name: 'Paolo Cannone'
                  email: 'gino@gino.it'
                  favRegions: ['Emilia-Romagna', 'Abruzzo']
                  type: 'admin'

      '400':
        description: Bad Request - Invalid input (e.g., missing username or password)
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      '401':
        description: Unauthorized
      '429':
        description: Too Many Requests - Rate limit exceeded
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      '500':
        description: Internal server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string

signup:
  security: [] # Public endpoint, no authentication required
  post:
    tags:
      - Authentication
    summary: Create a new user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/User.yaml'
    responses:
      '201':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/User.yaml'
      '400':
        description: Bad Request - Invalid input (e.g., malformed email, missing required fields, duplicate username/email)
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string

delete:
  post:
    summary: Delete user account
    description: Deletes the user account and all associated data.
    tags:
      - Authentication
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      '200':
        description: Account deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      '400':
        description: Bad Request - Missing or invalid input
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      '500':
        description: Internal Server Error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
