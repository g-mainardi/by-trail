login:
  security: [] # Public endpoint, no authentication required
  post:
    tags:
      - Authentication
    summary: User login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/requests.yaml#/LoginRequest'
    responses:
      '200':
        description: Successful login
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  $ref: '../components/parameters.yaml#/token'
                user:
                  $ref: '../components/parameters.yaml#/userLoginInfo'
      '400':
        description: Bad Request - Invalid input (e.g., missing username or password)
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              example:
                - 'Invalid credentials'
                - 'There was a problem with your account. Please contact support at support@example.com.'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenError_bannedUser'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

signup:
  security: [] # Public endpoint, no authentication required
  post:
    tags:
      - Authentication
    summary: Create a new user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/requests.yaml#/SignupRequest'
    responses:
      '201':
        description: User created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/User.yaml'
      '400':
        description: Bad Request - Invalid input (e.g., malformed email, missing required fields, duplicate email)
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              example:
                - 'Please fill in all required fields'
                - 'Please provide a valid email address'
                - 'Email already registered'
                - 'Password must be at least 8 characters long'
                - 'Password must contain at least one uppercase letter, one lowercase letter, and one number'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'

delete:
  post:
    summary: Delete user account
    description: Deletes the authenticated user account and all associated data.
    tags:
      - Authentication
    requestBody:
      description: User password for account deletion
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - password
            properties:
              password:
                $ref: '../components/parameters.yaml#/password'

    responses:
      '204':
        description: Account deleted successfully
      '400':
        description: Bad Request - Missing or invalid input
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              example:
                - 'Invalid credentials'
                - 'Password is required'
                - 'There was a problem with your account. Please contact support at support@example.com.'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedError'
      '429':
        $ref: '../components/responses.yaml#/TooManyRequestsError'
      '500':
        $ref: '../components/responses.yaml#/ServerError'
