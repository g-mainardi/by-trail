/proposal:
  post:
    tags:
      - Proposals
    summary: Submit a new route or bivouac proposal
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Proposal.yaml"
    responses:
      "201":
        description: Proposal created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                message:
                  type: string
      "400":
        description: Bad Request - Invalid input data
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      "401":
        description: Unauthorized - Authentication required
      "500":
        description: Internal server error
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string