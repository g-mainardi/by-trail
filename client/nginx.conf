server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # SPA Golden Rule:
        # 1. Try to serve the requested file ($uri)
        # 2. If it's a directory, try to serve it ($uri/)
        # 3. Otherwise, return index.html and let Vue Router handle the routing
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for static assets (unique hash names generated by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}